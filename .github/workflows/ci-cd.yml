name: Deploy Ionic App Locally

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on:
      - self-hosted
      - Windows
      - X64

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Build Ionic image
        shell: pwsh
        run: docker build --pull -t ionic-crud:latest .

      - name: Remove previous container
        shell: pwsh
        continue-on-error: true
        run: docker rm -f ionic-crud

      - name: Start updated container
        shell: pwsh
        run: docker run -d --name ionic-crud --restart unless-stopped -p 8100:80 ionic-crud:latest

      - name: Verify app
        shell: pwsh
        run: |
          $success = $false

          for ($i = 1; $i -le 15; $i++) {
            try {
              $response = Invoke-WebRequest -Uri "http://localhost:8100/" -UseBasicParsing -TimeoutSec 2
              if ($response.StatusCode -eq 200) {
                $success = $true
                break
              }
            }
            catch {
              Start-Sleep -Seconds 2
            }
          }

          if (-not $success) {
            docker logs ionic-crud
            exit 1
          }

          Write-Host "Ionic app is available at http://localhost:8100/"
